  <div class="mixing"><h1>Captura</h1><div class="actions"><label class="source-picker"><img class="icon" src="ui-assets/monitor.svg" alt=""><select aria-label="Fuente de video"><option>Ventana del juego</option><option>Monitor completo</option></select></label><span class="profile">1080p · 60 FPS · H.264</span></div>

<output id="feedback" aria-live="polite"></output>

<script>
const $ = selector => document.querySelector(selector);
const app = $('.app');
const panelNames = ['captura','clips','ajustes'];
const trackList = $('#tracks');
const feedback = $('#feedback');
const globalGain = $('#global-volume');
const mute = $('#mic-mute');
const clipGain = $('#clip-volume');
const params = new URLSearchParams(location.search);
const tracks = new Map();
const catalog = [
  ['game','Juego','#ffad85'], ['discord','Discord','#b2c6e9'],
  ['spotify','Spotify','#a6d5a9'], ['mic','Micrófono','#f2b2a5'],
  ['browser','Navegador','#d9cc98']
];
function openPanel(name){
  for(const panel of document.querySelectorAll('[data-panel]')) panel.hidden = panel.id !== name;
  for(const tab of document.querySelectorAll('[data-page]')){
    if(tab.dataset.page===name) tab.setAttribute('aria-current','page');
    else tab.removeAttribute('aria-current');
  }
  if(name==='captura') for(const track of tracks.values()) drawSignal(track);
}
document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>openPanel(button.dataset.page));
function rng(x,y){const v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v);}
function drawSignal(track){
  const canvas=track.canvas;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h)return;
  const dpr=Math.min(devicePixelRatio,2);
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  const c=canvas.getContext('2d');c.scale(dpr,dpr);
  c.fillStyle=track.color;c.font='9px Consolas,monospace';
  const columns=Math.floor(w/8);
  for(let i=0;i<columns;i++){
    const phase=i*.30+track.index*2.6;
    const shape=Math.min(1,(.10+.88*Math.pow(Math.abs(Math.sin(phase)),3)*(.3+.7*rng(i,track.index)))*track.gain.value/100);
    for(let y=-1;y<=1;y++){
      const strength=shape-Math.abs(y)*.32;
      if(strength<.04 || !track.include.checked)continue;
      c.globalAlpha=Math.min(1,.2+strength);
      c.fillText('·:+x%#@'[Math.min(6,Math.floor(strength*7))],i*8,h/2+3+y*5);
    }
  }
}
function syncTrack(track){
  const active=track.include.checked;
  track.row.classList.toggle('off',!active);
  track.gain.disabled=!active;
  track.value.value=track.gain.value+'%';
  track.gain.style.setProperty('--fill',(Number(track.gain.value)/2)+'%');
  track.gain.setAttribute('aria-valuetext',track.value.value);
  drawSignal(track);
}
function showGain(input){
  input.parentElement.querySelector('output').value=input.value+'%';
  input.setAttribute('aria-valuetext',input.value+'%');
}
function addTrack([id,name,color]){
  if(tracks.has(id))return;
  const row=document.createElement('div');
  row.className='track';row.style.setProperty('--tint',color);
  row.innerHTML='<label><input type="checkbox" checked><span></span></label><canvas class="signal" aria-hidden="true"></canvas><div class="gain"><input type="range" min="0" max="200" value="100"><output class="readout"></output></div>';
  const icons={game:'game-controller',discord:'discord-logo',spotify:'spotify-logo',mic:'microphone',browser:'browser'};
  const image=document.createElement('img');image.className='icon';image.alt='';image.src='ui-assets/'+icons[id]+'.svg';
  const label=row.querySelector('label span');label.before(image);label.textContent=name;
  const track={row,name,color,index:tracks.size,include:row.querySelector('[type=checkbox]'),gain:row.querySelector('[type=range]'),value:row.querySelector('output'),canvas:row.querySelector('canvas')};
  track.gain.id='volume-'+id;
  track.gain.setAttribute('aria-label','Volumen de '+name);
  track.value.setAttribute('for',track.gain.id);
  track.include.setAttribute('aria-label','Incluir '+name+' en el clip');
  trackList.append(row);tracks.set(id,track);
  track.gain.oninput=()=>{
    syncTrack(track);
    if(id==='mic'){globalGain.value=track.gain.value;showGain(globalGain);}
  };
  track.include.onchange=()=>{
    if(id==='mic')mute.checked=!track.include.checked;
    syncTrack(track);updateCount();
  };
  syncTrack(track);
}
function updateCount(){
  const included=[...tracks.values()].filter(t=>t.include.checked).length;
  $('#count').textContent=included+' de '+tracks.size;
}
catalog.slice(0,4).forEach(addTrack);updateCount();
$('#refresh').onclick=async event=>{
  const button=event.currentTarget;
  button.disabled=true;feedback.value='Buscando pistas de ejemplo…';
  await new Promise(resolve=>setTimeout(resolve,300));
  const before=tracks.size;
  catalog.forEach(addTrack);updateCount();button.disabled=false;
  feedback.value=before===tracks.size?'Las pistas están actualizadas.':'Se añadió Navegador a las pistas de ejemplo.';
};
globalGain.oninput=()=>{
  showGain(globalGain);
  const mic=tracks.get('mic');mic.gain.value=globalGain.value;syncTrack(mic);
};
mute.onchange=()=>{
  const mic=tracks.get('mic');mic.include.checked=!mute.checked;syncTrack(mic);updateCount();
};
clipGain.oninput=()=>{showGain(clipGain);$('.copy-notice').value='';};
for(const reset of document.querySelectorAll('[data-reset]')){
  reset.onclick=()=>{const input=document.getElementById(reset.dataset.reset);input.value=100;input.dispatchEvent(new Event('input'));};
}
$('[data-copy]').onclick=()=>$('.copy-notice').value='Ejemplo · Copia con el micrófono al '+clipGain.value+'%.';
function previewSave(){openPanel('captura');feedback.value='Ejemplo · 30 s con '+[...tracks.values()].filter(t=>t.include.checked).length+' pistas seleccionadas.';}
$('#save').onclick=previewSave;
document.addEventListener('keydown',e=>{if(e.key==='F9'&&!e.repeat){e.preventDefault();previewSave();}});

// Keep the glyphs in body coordinates so the scales travel with each fish.
const tau=2*Math.PI;
const sharksCanvas=$('#front');
const sharksContext=sharksCanvas.getContext('2d');
const sharks=[
  {place:.09,length:.42,beat:.72,seed:7,kind:'hammerhead'},
  {place:.42,length:.32,beat:.91,seed:31,kind:'mako'},
  {place:.76,length:.37,beat:.84,seed:53,kind:'mako'}
];
let swimming=!matchMedia('(prefers-reduced-motion: reduce)').matches;
let seconds=0, timer=null, previousTick=0;
let pondWidth=0, pondHeight=0;
const sharksInk=['#e0ecfc','#b6cbe1','#91abc8','#748eab','#5d7594','#4d627d'];
const marks=['.',':',';','t','o','X','S','%','8','@'];
let typeAtlas;

function makeTypeAtlas(scale){
  const narrow=pondWidth<670;
  const width=narrow?6:8, height=narrow?8:10;
  const tileW=Math.round(width*scale), tileH=Math.round(height*scale);
  const atlas=document.createElement('canvas');
  atlas.width=tileW*marks.length;atlas.height=tileH*sharksInk.length;
  const pen=atlas.getContext('2d');
  pen.textAlign='center';pen.textBaseline='middle';
  pen.font='600 '+Math.round(tileH*.96)+'px Consolas, monospace';
  sharksInk.forEach((color,row)=>marks.forEach((mark,col)=>{
    const x=col*tileW,y=row*tileH;
    pen.fillStyle=color;pen.globalAlpha=.21;pen.fillRect(x,y,tileW-scale,tileH-scale);
    pen.globalAlpha=1;pen.fillText(mark,x+tileW*.47,y+tileH*.52);
  }));
  return {atlas,width,height,tileW,tileH};
}
// Measure the circuit once per resize. Distances along the curve keep the
// clearance proportional to body length even through the tightest turns.
let circuit=[], perimeter=0;
function buildCircuit(){
  circuit=[];perimeter=0;
  for(let i=0;i<=240;i++){
    const angle=tau*i/240;
    const x=pondWidth*(.5+.39*Math.cos(angle));
    const y=pondHeight*(.49+.35*Math.sin(angle)+.034*Math.sin(2*angle));
    if(i)perimeter+=Math.hypot(x-circuit[i-1].x,y-circuit[i-1].y);
    circuit.push({x,y,d:perimeter});
  }
}
function routePoint(distance){
  const d=((distance%perimeter)+perimeter)%perimeter;
  let left=0,right=circuit.length-1;
  while(right-left>1){
    const mid=(left+right)>>1;
    if(circuit[mid].d<=d)left=mid;else right=mid;
  }
  const a=circuit[left],b=circuit[right],span=b.d-a.d;
  const dx=(b.x-a.x)/span,dy=(b.y-a.y)/span;
  return {x:a.x+(d-a.d)*dx,y:a.y+(d-a.d)*dy,dx,dy};
}
function spineAt(fish,time,length){
  const lead=perimeter*(fish.place+time/36+.008*Math.sin(time*.18+fish.seed));
  const segments=[],parts=28,step=length/parts;
  let previous;
  for(let i=0;i<=parts;i++){
    const u=i/parts;
    const p=routePoint(lead-u*length);
    const bend=length*(.004+.055*u*u)*Math.sin(tau*(fish.beat*time-.86*u)+fish.seed);
    const x=p.x-p.dy*bend,y=p.y+p.dx*bend;
    if(previous){
      const dx=x-previous.x,dy=y-previous.y,span=Math.hypot(dx,dy);
      segments.push({x:previous.x,y:previous.y,dx:dx/span,dy:dy/span});
    }
    previous={x,y};
  }
  return {segments,step};
}
// Sample the bending silhouette on a screen-aligned character grid. Each occupied
// cell gets one upright glyph, including where the tail turns sharply.
function drawShark(fish,time){
  const length=Math.max(175,pondWidth*fish.length);
  const {segments,step}=spineAt(fish,time,length);
  const {atlas,width,height,tileW,tileH}=typeAtlas;
  const pad=.28*length;
  const x0=Math.max(0,Math.floor((Math.min(...segments.map(s=>s.x))-pad)/width));
  const y0=Math.max(0,Math.floor((Math.min(...segments.map(s=>s.y))-pad)/height));
  const x1=Math.min(Math.ceil(pondWidth/width),Math.ceil((Math.max(...segments.map(s=>s.x))+pad)/width));
  const y1=Math.min(Math.ceil(pondHeight/height),Math.ceil((Math.max(...segments.map(s=>s.y))+pad)/height));
  for(let row=y0;row<y1;row++)for(let col=x0;col<x1;col++){
    const x=(col+.5)*width,y=(row+.5)*height;
    let best=Infinity,u=0,v=0;
    for(let i=0;i<segments.length;i++){
      const s=segments[i],ax=x-s.x,ay=y-s.y;
      const along=ax*s.dx+ay*s.dy;
      const nearest=Math.max(0,Math.min(step,along));
      const ex=ax-s.dx*nearest,ey=ay-s.dy*nearest,d2=ex*ex+ey*ey;
      if(d2>=best)continue;
      best=d2;
      if((i===0 && along<0)||(i===segments.length-1 && along>step)){u=-1;continue;}
      u=(i*step+nearest)/length;
      v=Math.sign(ay*s.dx-ax*s.dy)*Math.sqrt(d2)/length;
    }
    if(u<=0||u>=1)continue;
    const edge=Math.abs(v);
    const hammer=fish.kind==='hammerhead';
    // A narrow tail stock, swept pectoral fins and a crescent tail read from above.
    const nose=hammer?.065:.14;
    const body=Math.min(u/nose,1)*Math.max(.009,.093*(1-.79*u)*Math.min(1,(.85-u)/.23));
    const head=hammer && u<.087 && edge<.167 && u>.009+edge*.10 && u<.063+edge*.15;
    const finReach=Math.max(0,(u-.23)*1.63);
    const pectoral=u>.23 && u<.48 && edge<Math.min(.245,finReach) && edge>Math.max(0,(u-.35)*2.14);
    const tail=u>.78 && edge<(u-.78)*.91 && edge>Math.max(0,(u-.832)*1.12);
    if(!head && !pectoral && !tail && (edge>body || u>.835))continue;
    const eye=hammer ? head && edge>.142 : u>.085 && u<.115 && edge>.046;
    const gill=u>.15 && u<.235 && edge>body*.47 && Math.sin(230*u+edge*19)>.27;
    const fin=edge>body;
    const relief=body>0?Math.min(1,edge/body):1;
    const grain=rng(Math.floor(u*58)+fish.seed,Math.floor(v*77));
    const pigment=eye?0:gill?5:fin?3:Math.min(4,Math.floor(relief*3.25+(v>0?.70:0)+grain*.65));
    const density=eye?9:gill?2:Math.max(1,Math.min(9,Math.floor(7.5-relief*3+grain*3-(fin?1:0))));
    sharksContext.drawImage(atlas,density*tileW,pigment*tileH,tileW,tileH,col*width,row*height,width,height);
  }
}
function renderFish(time){
  sharksContext.clearRect(0,0,pondWidth,pondHeight);
  for(const fish of sharks)drawShark(fish,time);
}
function resizePond(){
  pondWidth=sharksCanvas.clientWidth;pondHeight=sharksCanvas.clientHeight;
  const scale=Math.min(devicePixelRatio,2);
  sharksCanvas.width=Math.round(pondWidth*scale);
  sharksCanvas.height=Math.round(pondHeight*scale);
  sharksContext.setTransform(scale,0,0,scale,0,0);
  buildCircuit();
  typeAtlas=makeTypeAtlas(scale);
  renderFish(seconds);
  for(const track of tracks.values())drawSignal(track);
}
function syncMotion(){
  clearInterval(timer);
  if(swimming && !document.hidden){
    previousTick=performance.now();
    timer=setInterval(()=>{
      const now=performance.now();
      const dt=Math.min(.12,(now-previousTick)/1000);previousTick=now;
      seconds+=dt*.36;
      renderFish(seconds);
    },1000/24);
  }
  const label=swimming?'Pausar fondo':'Animar fondo';
  const button=$('#motion');button.querySelector('span').textContent=label;
  button.setAttribute('aria-label',label);button.title=label;
  button.querySelector('img').src='ui-assets/'+(swimming?'pause':'play')+'.svg';
}
resizePond();
new ResizeObserver(resizePond).observe(app);
$('#motion').onclick=()=>{swimming=!swimming;syncMotion();};
document.addEventListener('visibilitychange',syncMotion);syncMotion();
openPanel(panelNames.includes(params.get('panel'))?params.get('panel'):'captura');
</script>
