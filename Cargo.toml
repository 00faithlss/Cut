[package]
name = "cut"
version = "0.3.2"
edition = "2024"
default-run = "Cut"
autobins = false

[features]
default = ["native-gpui"]
legacy-web = ["dep:tao", "dep:wry"]
native-gpui = ["dep:gpui"]

# The app. Named "Cut" so Windows shows Cut.exe.
[[bin]]
name = "Cut"
path = "src/native_main.rs"
required-features = ["native-gpui"]

# The previous WebView2 interface, kept for reference until it is removed.
[[bin]]
name = "cut-legacy"
path = "src/main.rs"
required-features = ["legacy-web"]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"], optional = true }
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = { version = "0.35", optional = true }
wry = { version = "0.55", optional = true }
windows-capture = "2"
win-native-media = "0.1.1"
winreg = "0.55"
windows = { version = "0.62", features = ["Security_Authorization_AppCapabilityAccess", "Win32_Graphics_Direct3D_Fxc", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_Variant", "Win32_System_WinRT_Graphics_Capture", "Win32_System_Threading", "Win32_Security"] }
wasapi = "0.27"
tray-icon = { version = "0.26", default-features = false }
png = "0.18"
mp4 = "0.14"
nnnoiseless = { version = "0.5.2", default-features = false }
