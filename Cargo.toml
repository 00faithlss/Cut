[package]
name = "cut"
version = "0.1.0"
edition = "2024"

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.35"
wry = "0.55"
windows-capture = "2"
global-hotkey = "0.8"
win-native-media = "0.1.1"
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_Variant", "Win32_System_WinRT_Graphics_Capture", "Win32_System_Threading", "Win32_Security"] }
wasapi = "0.27"
tray-icon = { version = "0.26", default-features = false }
png = "0.18"
mp4 = "0.14"
